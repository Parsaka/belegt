# One task per report: Kubernetes sets JOB_COMPLETION_INDEX, `belegt reports` reads that row.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-reports-{{ .Values.runId }}
  labels: {{- include "belegt-reports.labels" . | nindent 4 }}
spec:
  completionMode: Indexed
  completions: {{ include "belegt-reports.rows" . }}
  parallelism: {{ .Values.parallelism }}
  backoffLimitPerIndex: {{ .Values.backoffLimitPerIndex }}
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels: {{- include "belegt-reports.labels" . | nindent 8 }}
      annotations:
        checksum/seed: {{ .Values.seed | sha256sum }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: extract
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --seed=/config/reports.csv
            - --work=/tmp/work
            - --out={{ .Values.out }}
            {{- with .Values.pdfOut }}
            - --pdf-out={{ . }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: seed, mountPath: /config, readOnly: true}
            - {name: scratch, mountPath: /tmp}
      volumes:
        - name: seed
          configMap:
            name: {{ .Release.Name }}-reports-seed
        - name: scratch
          emptyDir: {sizeLimit: 1Gi}
