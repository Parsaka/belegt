{{- if .Values.networkPolicy.enabled }}
# No ingress. Egress only to download reports, reach the metadata server and resolve names.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-reports
  labels: {{- include "belegt-reports.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "belegt-reports.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
        - {port: 80, protocol: TCP}
        - {port: 443, protocol: TCP}
        - {port: 988, protocol: TCP}
        {{- range .Values.networkPolicy.extraEgressPorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
{{- end }}
