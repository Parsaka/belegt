{{- if and (not .Values.auth.existingSecret) .Values.auth.demoTokens }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "belegt-api.secretName" . }}
  labels: {{- include "belegt-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  BELEGT_TOKENS: {{ .Values.auth.demoTokens | quote }}
{{- end }}
