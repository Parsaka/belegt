apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "belegt-api.name" . }}
  labels: {{- include "belegt-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "belegt-api.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "belegt-api.labels" . | nindent 8 }}
      annotations:
        checksum/chunks: {{ .Values.chunks.inline | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: BELEGT_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "belegt-api.secretName" . }}
                  key: BELEGT_TOKENS
          volumeMounts:
            - {name: chunks, mountPath: /data, readOnly: true}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: chunks
          configMap:
            name: {{ include "belegt-api.name" . }}-chunks
