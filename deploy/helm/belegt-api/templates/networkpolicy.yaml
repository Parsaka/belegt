# Ingress only on the API port. No egress: the offline answerer needs no network.
# Add an egress rule for the model endpoint when the Vertex AI adapter is enabled.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "belegt-api.name" . }}
  labels: {{- include "belegt-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "belegt-api.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {port: 8080}
  egress: []
