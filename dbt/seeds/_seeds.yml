version: 2

seeds:
  - name: entity_overrides
    description: Human decisions on matches from the review queue. One row per EEA parent name.
    config:
      column_types:
        source_name: varchar
        lei: varchar
        decision: varchar
        reviewer: varchar
        reviewed_at: date
    columns:
      - name: source_name
        tests: [unique, not_null]
      - name: decision
        tests:
          - accepted_values:
              arguments:
                values: [accepted, rejected]

  - name: reports
    description: >
      Sustainability statements to extract (German edition of the annual report). Links only:
      the PDFs are copyrighted and live in the private reports bucket.
    config:
      column_types:
        doc_id: varchar
        company: varchar
        lei: varchar
        report_year: integer
        fiscal_year_end: varchar
        language: varchar
        url: varchar
        host_note: varchar
    columns:
      - name: doc_id
        tests: [unique, not_null]
      - name: lei
        tests: [not_null]
