version: 2

seeds:
  - name: entity_overrides
    description: Human decisions on matches from the review queue. One row per EEA parent name.
    config:
      column_types:
        source_name: varchar
        lei: varchar
        decision: varchar
        reviewer: varchar
        reviewed_at: date
    columns:
      - name: source_name
        tests: [unique, not_null]
      - name: decision
        tests:
          - accepted_values:
              arguments:
                values: [accepted, rejected]
