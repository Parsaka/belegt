name: Inspect sources

# Discovery run: downloads the public source files and prints their structure.
# Runs on GitHub's network because the development sandbox has no access to these hosts.
on:
  workflow_dispatch:
  push:
    branches: [pre-trial/sources]
    paths: [scripts/inspect_sources.py, scripts/inspect_eea_accdb.sh, .github/workflows/inspect-sources.yml]

permissions:
  contents: write  # pushes the discovery output to the inspect-results branch

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx openpyxl && sudo apt-get install -y -qq mdbtools
      - run: python scripts/inspect_sources.py ur gleif 2>&1 | tee inspect.log
      - run: bash scripts/inspect_eea_accdb.sh 2>&1 | tee -a inspect.log
      # The development sandbox cannot read Actions logs or artifacts, so the output goes to a
      # throw-away branch. It holds discovery output only, never source PDFs.
      - name: Push output to inspect-results
        run: |
          mkdir -p /tmp/out && cp -r inspect inspect.log /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan inspect-results
          git rm -rq --cached . && git clean -fdq -e inspect -e inspect.log
          git add inspect inspect.log
          git commit -qm "Discovery output from run ${{ github.run_id }}"
          git push -f origin inspect-results
