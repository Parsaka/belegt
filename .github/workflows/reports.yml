name: Reports

# Scope 1-3 figures from the sustainability statements in dbt/seeds/reports.csv.
#
# - discover: on the runner, every report in sequence. Publishes the extracted figures with page
#   and table line, plus where each report mentions the scopes, to tune the extractor. The PDFs
#   stay on the runner and are gone with it.
# - gke (during the trial) or cloud-run (afterwards): the production path, one task per report,
#   on a GKE Autopilot Indexed Job or the Cloud Run job `reports`. The same image and the same
#   task-index contract; the PDFs go to the private reports bucket, the figures next to them,
#   and the Pipeline workflow loads them into BigQuery.
on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Also run the production tasks
        type: choice
        options: [none, gke, cloud-run]
        default: none
  push:
    branches: [main, "phase2/**"]
    paths:
      - src/belegt/documents/**
      - dbt/seeds/reports.csv
      - scripts/report_summary.py
      - scripts/probe_reports.py
      - .github/workflows/reports.yml

permissions:
  contents: read

concurrency:
  group: reports
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs,extract]"
      - run: mkdir -p summary
      - name: Download and extract (PDFs to the runner's scratch space only)
        run: |
          belegt reports --out /tmp/reports --pdf-out /tmp/reports --work /tmp/work \
            | tee /tmp/results.jsonl
      - if: always()
        run: |
          python scripts/report_summary.py /tmp/reports /tmp/results.jsonl > summary/reports.md
          python scripts/probe_reports.py /tmp/reports > summary/probe.md
          cp /tmp/results.jsonl summary/results.jsonl
          mkdir -p summary/metrics && cp /tmp/reports/metrics/*.jsonl summary/metrics/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary-discover
          path: summary

  gke:
    if: inputs.runtime == 'gke' && vars.TRIAL_MODE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: pipeline
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: europe-west1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: pipeline@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin
      - uses: azure/setup-helm@v4
      - name: Build and push the image
        id: image
        run: |
          repo="${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/belegt/belegt-reports"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --target reports -t "$repo:$GITHUB_SHA" .
          docker push "$repo:$GITHUB_SHA"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: belegt
          location: ${{ env.REGION }}
      - name: Run one task per report
        run: |
          mkdir -p summary
          run_id="r${GITHUB_RUN_ID}"
          helm upgrade --install reports deploy/helm/belegt-reports \
            --namespace belegt --create-namespace \
            --set image.repository="${{ steps.image.outputs.repo }}" \
            --set image.tag="$GITHUB_SHA" --set runId="$run_id" \
            --set out="gs://${GCP_PROJECT_ID}-reports/extracted" \
            --set pdfOut="gs://${GCP_PROJECT_ID}-reports" \
            --set-file seed=dbt/seeds/reports.csv
          job="job/reports-reports-${run_id}"
          # Complete or Failed, whichever comes first (a failed task has used its own retries)
          for _ in $(seq 1 180); do
            done_=$(kubectl -n belegt get "$job" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}{.status.conditions[?(@.type=="Failed")].status}')
            [ -n "$done_" ] && break
            sleep 10
          done
          kubectl -n belegt get "$job" -o jsonpath='{range .status.conditions[*]}{.type}={.status} {end}{"\n"}completed={.status.completedIndexes} failed={.status.failedIndexes}{"\n"}' \
            | tee summary/job.txt
          kubectl -n belegt logs -l "app.kubernetes.io/instance=reports" --tail=1 --max-log-requests=20 \
            | grep '^{' > /tmp/results.jsonl || true
          mkdir -p /tmp/out/metrics
          gcloud storage cp "gs://${GCP_PROJECT_ID}-reports/extracted/metrics/*.jsonl" /tmp/out/metrics/
      - if: always()
        run: |
          pip install -q -e .
          python scripts/report_summary.py /tmp/out /tmp/results.jsonl > summary/reports.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary-gke
          path: summary

  cloud-run:
    if: inputs.runtime == 'cloud-run'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: pipeline
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: europe-west1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: pipeline@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: One task per report (the image is the one Deploy rolled out)
        run: |
          mkdir -p summary /tmp/out/metrics
          { time gcloud run jobs execute reports --region "$REGION" --wait ; } 2>&1 | tail -5 | tee summary/job.txt
          # Cloud Logging parses each printed JSON line into jsonPayload
          gcloud logging read "resource.type=cloud_run_job AND resource.labels.job_name=reports AND jsonPayload.doc_id:*" \
            --freshness=1h --format=json | jq -c '.[].jsonPayload' > /tmp/results.jsonl
          gcloud storage cp "gs://${GCP_PROJECT_ID}-reports/extracted/metrics/*.jsonl" /tmp/out/metrics/
      - if: always()
        run: |
          pip install -q -e .
          python scripts/report_summary.py /tmp/out /tmp/results.jsonl > summary/reports.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary-cloud-run
          path: summary

  report:
    needs: [discover, gke, cloud-run]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: summary-*
          path: /tmp/summary
      - name: Push to ops-results
        run: |
          printf 'discover: %s\ngke: %s\ncloud-run: %s\n' "${{ needs.discover.result }}" \
            "${{ needs.gke.result }}" "${{ needs.cloud-run.result }}" > /tmp/RESULT.md
          bash scripts/push_ops_result.sh reports /tmp/RESULT.md /tmp/summary/*
