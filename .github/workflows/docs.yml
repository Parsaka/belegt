name: Docs

# Publishes the project page (docs/site) at the root of GitHub Pages and the dbt docs (lineage
# graph and column docs) under /dbt/. The dbt docs are built on the trimmed real fixtures with
# DuckDB, so they need no cloud credentials; the models are the same ones that run on BigQuery.
# Pages must be set to "GitHub Actions" in the repository settings.
on:
  push:
    branches: [main]
    paths: [docs/site/**, docs/img/**, dbt/**, src/belegt/loaders/**, src/belegt/warehouse.py, tests/fixtures/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[load,dbt]"
      - run: belegt load --source tests/fixtures --db data/belegt.duckdb
      - run: dbt build --project-dir dbt --profiles-dir dbt
      - run: dbt docs generate --static --project-dir dbt --profiles-dir dbt
      - name: Assemble the site
        run: |
          mkdir -p site/dbt site/img
          cp docs/site/index.html site/index.html
          cp docs/img/*.jpg site/img/
          cp dbt/target/static_index.html site/dbt/index.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
