name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,dbt]"
      - name: pytest (offline; live tests deselected)
        run: pytest -m "not live" --cov=belegt --cov-report=term-missing

  dbt:
    # The warehouse models on the real fixtures: load, build (models, snapshot, tests), docs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[load,dbt]"
      - run: belegt load --source tests/fixtures --db data/belegt.duckdb
      - run: dbt build --project-dir dbt --profiles-dir dbt
      - run: dbt docs generate --project-dir dbt --profiles-dir dbt
