name: Infra

on:
  pull_request:
    paths: [infra/**, .github/workflows/infra.yml]
  push:
    branches: [main]
    paths: [infra/**, .github/workflows/infra.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # Runs only once scripts/bootstrap_gcp.sh has been run and its variables are set.
  plan:
    needs: validate
    if: github.event_name == 'pull_request' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_ci_service_account_email: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      TF_VAR_trial_mode: ${{ vars.TRIAL_MODE || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=belegt"
      - run: terraform plan -input=false -lock-timeout=60s

  apply:
    needs: validate
    if: github.event_name == 'push' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: gcp # require the owner's approval in the repository settings
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_ci_service_account_email: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      TF_VAR_trial_mode: ${{ vars.TRIAL_MODE || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=belegt"
      - run: terraform apply -input=false -auto-approve -lock-timeout=60s
