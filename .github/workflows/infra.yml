name: Infra

on:
  pull_request:
    paths: [infra/**, .github/workflows/infra.yml]
  push:
    branches: [main]
    paths: [infra/**, .github/workflows/infra.yml]
  # After a repository variable changed (TRIAL_MODE): apply main again
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash # with pipefail, so `| tee` does not hide a failing terraform

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # job defaults replace the workflow's: repeat it, or `| tee` hides a failure
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # Runs only once scripts/bootstrap_gcp.sh has been run and its variables are set.
  plan:
    needs: validate
    if: github.event_name == 'pull_request' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the summary to the ops-results branch
      id-token: write
    defaults:
      run:
        shell: bash # job defaults replace the workflow's: repeat it, or `| tee` hides a failure
        working-directory: infra
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_ci_service_account_email: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      TF_VAR_trial_mode: ${{ vars.TRIAL_MODE || 'false' }}
      TF_VAR_looker_oauth_client_secret: ${{ secrets.LOOKER_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=belegt"
      - run: terraform plan -input=false -lock-timeout=60s -no-color 2>&1 | tee /tmp/plan.log
      - name: Publish the plan summary (the sandbox cannot read Actions logs)
        if: always()
        working-directory: .
        run: |
          grep -E '^(Plan:|No changes|Error|│)|will be (created|destroyed|updated|replaced)|must be replaced' /tmp/plan.log > /tmp/plan-summary.txt || true
          bash scripts/push_ops_result.sh infra-plan /tmp/plan-summary.txt

  apply:
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: gcp # require the owner's approval in the repository settings
    permissions:
      contents: write # pushes the summary to the ops-results branch
      id-token: write
    defaults:
      run:
        shell: bash # job defaults replace the workflow's: repeat it, or `| tee` hides a failure
        working-directory: infra
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_ci_service_account_email: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      TF_VAR_trial_mode: ${{ vars.TRIAL_MODE || 'false' }}
      TF_VAR_looker_oauth_client_secret: ${{ secrets.LOOKER_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=belegt"
      - run: terraform apply -input=false -auto-approve -lock-timeout=60s -no-color 2>&1 | tee /tmp/apply.log
      - name: Publish the apply summary (the sandbox cannot read Actions logs)
        if: always()
        working-directory: .
        run: |
          grep -E '^(Apply complete|Error|│)|: Creation complete|: Destruction complete|: Modifications complete' /tmp/apply.log > /tmp/apply-summary.txt || true
          bash scripts/push_ops_result.sh infra-apply /tmp/apply-summary.txt
